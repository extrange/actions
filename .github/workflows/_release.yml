name: Create Github Release
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }} # Required for gh commands

jobs:
  devenv-test:
    uses: ./.github/workflows/devenv-test.yml

  update-tags:
    runs-on: ubuntu-latest
    needs: devenv-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main

      - name: Update README.md
        run: |
          sed -Ei 's/@v\S+/@${{ github.ref_name }}/g' readme.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Update workflows in readme.md to version ${{ github.ref_name }}"

      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} --generate-notes
